services:
  mtbots:
    build: .
    # 现成镜像（CI 构建，公开可拉）。想本地构建就用 `docker compose up -d --build`，
    # 构建出来的镜像会就地打上同一个 tag。
    image: ghcr.io/mbaigc/mtbots:latest
    container_name: mtbots
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CONFIG_FILE: /app/data/config.json
      LITEPAN_USERS_FILE: /app/data/litepan-users.json
      LOG_DIR: /app/data/logs
      TZ: Asia/Shanghai
    volumes:
      # ① 特权：Docker 模块要能升级/清理宿主机上的 compose 项目。
      #    单人自用可以直接挂；想加保险就换成 docker-socket-proxy 的 HTTP 端点（见 README 的安全红线）。
      - /var/run/docker.sock:/var/run/docker.sock
      # ② 你的 compose 文件根目录（docker 模块要靠它读项目；按实际路径改）
      - /docker:/docker
      # ③ 三份配置合成一份 data/：Cline Key + LitePan 用户 + 日志
      #    远端主机（data/docker-hosts.json，kind=ssh）的私钥与 known_hosts 也放这里：
      #      ./data/ssh/id_ed25519（chmod 600）、./data/ssh/known_hosts
      #    远端不需要挂载任何目录——yml 留在远端、由远端的 CLI 解析（README「管理多台服务器」）
      - ./data:/app/data
    # 让容器里的 mtbots 用户能读写 docker.sock：填宿主机 socket 的属组 GID
    #   查：stat -c '%g' /var/run/docker.sock   （NAS 上常常没有 docker 组条目，别用 getent 猜）
    #   改完必须重建容器：docker compose up -d --force-recreate（restart 不会重新套用 group_add）
    #   查到 0（socket 属 root:root）时 group_add 救不了 → 换 user: "0:0" 或 docker-socket-proxy
    group_add:
      - "${DOCKER_GID:-999}"
    # 以 root 运行（覆盖 Dockerfile 里的 USER mtbots）：
    #   `docker compose` 解析项目时**必须**能读项目目录下的 `.env`（`${VAR:?}` 插值 + 传给容器）。
    #   项目 `.env` 通常是 root:600，容器里的 mtbots(10001) 读不到 → pull / up -d / stop 全部报
    #   `open …/.env: permission denied`。保持 10001 就得给每个项目的 `.env` 单独放权限，新项目还得再来一次。
    # 代价：容器内进程有 root 能力，`data/` 下新写的文件会归 root（要切回 10001 得 chown -R）。
    # 注意：本容器已挂 docker.sock，能碰它的代码本来就能 `docker run -u 0 -v /:/host` 读走宿主机文件，
    #       所以这一步并没有扩大实际权限边界；要真正收敛请上 docker-socket-proxy（见 README 安全红线）。
    user: "0:0"
    # 只读根文件系统 + 禁止提权（沿用 LitePan / ClinePass 的做法）
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
